{% extends 'base.html' %}
{% block content %}
<section class="max-w-4xl mx-auto py-12 px-6 bg-gradient-to-r from-blue-50 to-indigo-50 shadow-lg rounded-2xl">
  <!-- Заголовок -->
  <h2 class="text-3xl font-extrabold text-gray-800 mb-10 text-center">
    🛒 Оформление заказа
  </h2>

  <div class="grid md:grid-cols-2 gap-8">
    <!-- Форма -->
    <form method="post" class="space-y-6 bg-white p-6 rounded-xl shadow">
      {% csrf_token %}

      <!-- Имя -->
      <div>
        <label for="full_name" class="block text-sm font-semibold text-gray-700 mb-2">Имя Фамилия</label>
        <input
          type="text"
          name="full_name"
          id="full_name"
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <!-- Телефон -->
      <div>
        <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Телефон</label>
        <input
          type="text"
          name="phone"
          id="phone"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <!-- Адрес -->
      <div>
        <label for="address" class="block text-sm font-semibold text-gray-700 mb-2">Адрес</label>
        <textarea
          name="address"
          id="address"
          rows="4"
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none"
        ></textarea>
      </div>

      <!-- Кнопка -->
      <div class="pt-4">
        <button
          type="submit"
          class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition font-semibold shadow-md"
        >
          ✅ Подтвердить заказ
        </button>
      </div>
    </form>

    <!-- Блок корзины -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-xl font-bold text-gray-800 mb-4">🛍️ Ваша корзина</h3>
      <ul class="divide-y divide-gray-200 mb-4">
        {% for item in cart %}
        <li class="py-3 flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}" class="w-16 h-16 rounded-md object-cover">
            <span class="font-medium text-gray-700">{{ item.product.name }}</span>
          </div>
          <span class="font-semibold text-gray-900">{{ item.product.price }}₺ × {{ item.quantity }}</span>
        </li>
        {% empty %}
        <li class="py-3 text-gray-500">Корзина пуста</li>
        {% endfor %}
      </ul>

      <div class="flex justify-between items-center border-t pt-4">
        <span class="text-lg font-bold">Итого:</span>
        <span class="text-xl font-extrabold text-indigo-600">{{ total }}₺</span>
      </div>
    </div>
  </div>
</section>
{% endblock %}
