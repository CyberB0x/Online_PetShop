{% extends "base.html" %}
{% block title %}Sign Up — Petshop{% endblock %}

{% block content %}
<section class="max-w-md mx-auto py-12 px-4">
  <h1 class="text-2xl font-bold mb-6 text-center">Sign Up</h1>

  <form method="post" class="space-y-4 bg-white p-6 rounded-xl shadow">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700">Username</label>
      <input type="text" name="username" required
             class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" name="email" required
             class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" name="password1" required
             class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Confirm password</label>
      <input type="password" name="password2" required
             class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring focus:ring-blue-200"/>
    </div>
    <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
      Sign Up
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-gray-600">
    Already have an account?
    <a href="/login/" class="text-blue-600 hover:underline">Sign In</a>
  </p>
</section>
{% endblock %}
