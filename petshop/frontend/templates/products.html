{% extends "base.html" %}
{% block title %}{{ product.name }} — Petshop{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto py-12 px-4">
  <div class="grid md:grid-cols-2 gap-8">
    <!-- Фото -->
    <div class="bg-white rounded-xl shadow p-4 flex items-center justify-center">
      {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-lg max-h-96 object-contain"/>
      {% else %}
        <div class="w-full h-64 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400">
          Нет изображения
        </div>
      {% endif %}
    </div>

    <!-- Описание -->
    <div>
      <h1 class="text-3xl font-bold mb-4">{{ product.name }}</h1>
      <p class="text-gray-600 mb-6">{{ product.description }}</p>
      <p class="text-2xl font-semibold text-blue-600 mb-6">{{ product.price }} ₸</p>

      <form method="post" action="/cart/add/{{ product.id }}/">
        {% csrf_token %}
        <input type="number" name="quantity" value="1" min="1"
               class="w-20 border rounded-lg px-3 py-2 mr-3"/>
        <button type="submit"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
          Добавить в корзину
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
