{% extends "base.html" %}
{% block title %}{{ product.name }} — Petshop{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <div class="grid md:grid-cols-2 gap-10 items-start">

    <!-- photo -->
    <div class="bg-white rounded-2xl shadow-lg p-6 flex items-center justify-center">
      {% if product.image %}
        <img src="{{ product.image.url }}"
             alt="{{ product.name }}"
             class="rounded-xl max-h-[400px] w-full object-contain" />
      {% else %}
        <div class="w-full h-80 bg-gray-100 rounded-xl flex items-center justify-center text-gray-400 text-lg">
          No image
        </div>
      {% endif %}
    </div>

    <!-- description -->
    <div class="space-y-6">
      <h1 class="text-4xl font-extrabold text-gray-900">{{ product.name }}</h1>
      <p class="text-gray-700 text-lg leading-relaxed">{{ product.description }}</p>
      <p class="text-3xl font-semibold text-blue-600">{{ product.price }} ₸</p>

      <form method="post" action="/cart/add/{{ product.id }}/" class="mt-6 flex flex-col sm:flex-row sm:items-center gap-4">
        {% csrf_token %}
        <input
          type="number"
          name="quantity"
          value="1"
          min="1"
          class="w-24 border border-gray-300 rounded-lg px-4 py-2 text-center shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />
        <button
          type="submit"
          class="bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 transition text-base font-medium shadow-md"
        >
          Add to cart
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
