{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded-lg p-6">
  <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded-lg mb-6">
  <h1 class="text-3xl font-bold mb-4">{{ product.name }}</h1>
  <p class="text-gray-700 mb-4">{{ product.description }}</p>
  <p class="text-2xl font-semibold text-blue-600 mb-6">{{ product.price }} ₺</p>
  <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Добавить в корзину</button>
</div>
{% endblock %}
