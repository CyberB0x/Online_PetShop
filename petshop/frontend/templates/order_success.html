{% extends 'base.html' %}

{% block content %}
<div class="container text-center mt-5">
    <div class="card shadow-lg p-5">
        <i class="fas fa-check-circle text-success fa-4x mb-3"></i>
        <h2 class="mb-3">Thank you for your order! <i class="fa-solid fa-gift"></i></h2>
        <p class="lead">Your order has been <strong>№{{ order.id }}</strong> successfully placed.</p>
        <p>We will contact you using the provided details.</p>
        <h4 class="text-primary mt-3">Order total: {{ order.get_total_price }}₺</h4>

        <div class="mt-4">
            <a href="{% url 'home' %}" class="btn btn-outline-primary me-2">
                <i class="fas fa-home"></i> Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
