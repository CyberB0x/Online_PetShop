{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12 text-center">
    <div class="bg-white shadow-xl rounded-2xl p-8">
        <i class="fas fa-check-circle text-green-500 text-6xl mb-4"></i>
        <h2 class="text-2xl font-bold mb-2">Thank you for your order! 🎁</h2>
        <p class="text-gray-600 mb-2">
            Your order <strong>№{{ order.id }}</strong> has been successfully placed.
        </p>
        <p class="text-gray-500">We will contact you using the provided details.</p>

        <div class="mt-6">
            <a href="{% url 'home' %}"
               class="inline-flex items-center px-6 py-2 border border-indigo-600 text-indigo-600 font-medium rounded-lg hover:bg-indigo-600 hover:text-white transition">
                <i class="fas fa-home mr-2"></i> Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
